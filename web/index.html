<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vellum</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<!-- ============================ START SCREEN ============================ -->
<section id="start-view" class="view start-view">
  <div class="start-bg" aria-hidden="true"></div>
  <header class="start-head">
    <div class="brand-lockup">
      <span class="brand-mark">❖</span>
      <div>
        <div class="brand">Vellum</div>
        <div class="brand-sub" data-i18n="startTagline">Your private, source-grounded notebooks.</div>
      </div>
    </div>
    <button id="start-theme" class="ghost" title="Toggle theme">◐</button>
  </header>

  <div class="start-body">
    <div class="start-titlerow">
      <h1 data-i18n="chooseVellum">Choose a Vellum</h1>
      <button id="new-vellum-btn" class="primary-btn">＋ <span data-i18n="newVellum">New Vellum</span></button>
    </div>
    <div id="vellum-grid" class="vellum-grid"></div>
  </div>
</section>

<!-- ============================ VELLUM VIEW ============================ -->
<section id="vellum-view" class="view vellum-view hidden">
  <header class="topbar">
    <button id="back-btn" class="ghost" title="Back to all Vellums">‹ <span data-i18n="back">Vellums</span></button>
    <div class="vellum-title" id="vellum-title">…</div>
    <div class="topbar-right">
      <div id="model-picker" class="model-picker"></div>
      <span id="net-badge" class="net-badge hidden" title=""></span>
      <button id="theme-toggle" class="ghost" title="Toggle theme">◐</button>
    </div>
  </header>

  <main class="layout">
    <!-- Sources -->
    <section class="panel sources">
      <div class="panel-head">
        <h2 data-i18n="sources">Sources</h2>
        <button id="add-btn" class="chip-btn">＋ <span data-i18n="add">Add</span></button>
      </div>
      <p class="hint" data-i18n="sourcesHint">Folders are scanned recursively. All data stays local.</p>
      <div id="reprocess-slot"></div>
      <div id="source-tree" class="source-tree"></div>
    </section>

    <!-- Chat -->
    <section class="panel chat">
      <h2><span data-i18n="chat">Chat</span>
        <span class="subtle" data-i18n="chatSub">— answers come only from your sources</span></h2>
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="2" data-i18n-ph="chatPlaceholder"
                  placeholder="Ask a question about your sources…"></textarea>
        <button type="submit" id="send-btn" data-i18n="send">Send</button>
      </form>
    </section>

    <!-- Citations -->
    <section class="panel citations">
      <h2 data-i18n="citations">Citations</h2>
      <div id="citations" class="citation-list">
        <p class="hint" data-i18n="citationsHint">Citations for the latest answer appear here.</p>
      </div>
    </section>
  </main>
</section>

<!-- ============================ MODALS ============================ -->
<div id="modal-root" class="modal-root hidden"></div>

<!-- file preview lightbox -->
<div id="preview-root" class="preview-root hidden">
  <div class="preview-backdrop"></div>
  <div class="preview-box">
    <div class="preview-head">
      <span id="preview-name" class="preview-name"></span>
      <button id="preview-close" class="ghost">✕</button>
    </div>
    <div id="preview-body" class="preview-body"></div>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
